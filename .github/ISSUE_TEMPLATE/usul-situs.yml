name: "Usul situs jadul / Suggest an old website"
description: "Situs tahun 1996-2008 yang wajib ada di Penjelajah Internet. Suggest a 1996-2008 site for the time-travel browser."
title: "Usul situs: "
labels: ["needs-triage", "content"]
body:
  - type: markdown
    attributes:
      value: |
        Situs akan dibuka lewat Internet Archive Wayback Machine, jadi pastikan pernah diarsipkan.
        Sites load through the Wayback Machine, so they need a snapshot.
        Datang dari website? Label `from-web` boleh ditambahkan lewat URL.
  - type: input
    id: name
    attributes:
      label: Nama situs / Site name
      placeholder: "Kafegaul"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL asli / Original URL
      placeholder: "http://www.kafegaul.com/"
    validations:
      required: true
  - type: dropdown
    id: year
    attributes:
      label: Tahun / Year
      description: Tahun saat situs ini paling berkesan. The year it mattered most.
      options: ["1996", "1997", "1998", "1999", "2000", "2001", "2002", "2003", "2004", "2005", "2006", "2007", "2008"]
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Kategori / Category
      options: ["Berita", "Portal", "Komunitas", "Hiburan", "Cari", "Email", "Download", "Game Online", "Lainnya / Other"]
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Kenapa situs ini penting? / Why does it belong here?
      description: Cerita singkat, kenangan, atau kenapa anak warnet dulu buka situs ini.
    validations:
      required: true
  - type: input
    id: snapshot
    attributes:
      label: Link Wayback (opsional) / Wayback snapshot link (optional)
      placeholder: "https://web.archive.org/web/2002/http://www.kafegaul.com/"
  - type: checkboxes
    id: ok
    attributes:
      label: Konfirmasi / Confirm
      options:
        - label: Situs ini bukan situs dewasa, judi, warez atau ujaran kebencian. Not adult, gambling, warez or hate content.
          required: true
