# Self-serve contributor ladder (MAINTAINERS.md).
#  - PR merged: count the author's merged PRs; at exactly 3 open "Nominasi triager: @user",
#    at exactly 10 "Nominasi maintainer: @user" (label `nomination`).
#  - Owner adds `approved` to a nomination: add the nominee to the org team with ORG_ADMIN_TOKEN
#    (triage team; maintainer team only if vars.MAINTAINER_TEAM is set). Skips with a comment
#    when the secret is missing. Never grants anything without the label from an admin.
name: nominate

on:
  # pull_request_target only to get a token that can open issues for merged fork PRs.
  # This workflow never checks out or runs PR code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [closed]
  issues:
    types: [labeled]

permissions: {}

jobs:
  count:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Count merged PRs and nominate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/bots/nominate.mjs count

  approve:
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'nomination')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Add nominee to the team
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORG_ADMIN_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          TRIAGE_TEAM: ${{ vars.TRIAGE_TEAM }}
          MAINTAINER_TEAM: ${{ vars.MAINTAINER_TEAM }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          SENDER: ${{ github.event.sender.login }}
        run: node scripts/bots/nominate.mjs approve
